version: 2

# The cooldown matches `exclude-newer` in pyproject.toml and `min-release-age` in .npmrc.
# Major versions stay out of the groups, so one breaking release can't hold up the rest.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  # Each of these needs contrib/vendor.py and npm run build run on its pull request, so they stay separate.
  - package-ecosystem: npm
    directory: /contrib/vendor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Preact 11.0.2 lost text typed just after a dialog closed, about 4% of the time on WebKit.
    # Before moving to 11, check that under CPU pressure, which pull request checks don't do.
    ignore:
      - dependency-name: preact
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # uv's version is shared with CI and install.sh, so it moves with them by hand.
    ignore:
      - dependency-name: ghcr.io/astral-sh/uv
