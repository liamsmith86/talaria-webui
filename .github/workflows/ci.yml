name: CI

on:
  pull_request:
  schedule:
    - cron: '43 8 * * 1'
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Run every platform and browser
        type: boolean
        default: false
      browser:
        description: Run one browser when full is off
        type: choice
        default: none
        options: [none, chromium, firefox, webkit]
      hermes_latest:
        description: Test the latest Hermes main commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full && 'full' || inputs.browser || 'none' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          checksum: &uv-checksum ${{ runner.os == 'macOS' && '301f72afaf54060f92da7016cb0115bd077f43a9c8e39c1d8170a0bac80fd398' || runner.arch == 'ARM64' && 'c36fe17937ff6bd16dc42fc13854b5465999fcab2efe0af559381e945e3c6001' || 'ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460' }}
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@12.0.1 --ignore-scripts
        working-directory: ${{ runner.temp }}
      - run: uv sync --locked --only-group lint
      - run: uv run --locked --only-group lint python contrib/quality.py
      - name: Verify the quality gates
        if: inputs.full
        run: |
          uv sync --locked
          uv run --locked pytest -q -m quality --fail-on-skip

  behavior:
    name: Public PR behavior
    needs: lint
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TALARIA_TEST_WORKERS: '2'
      TALARIA_AXE_PATH: ${{ github.workspace }}/.local/axe.min.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select checks from the PR merge changes
        id: scope
        run: python3 contrib/check.py ci --plan >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.scope.outputs.runtime == 'true'
        with:
          version: '0.12.9'
          checksum: *uv-checksum
          python-version: '3.14'
      - if: steps.scope.outputs.runtime == 'true'
        run: uv sync --locked
      - if: steps.scope.outputs.browser == 'true'
        run: |
          uv run --locked playwright install --with-deps chromium
          mkdir -p .local
          curl --fail --show-error --silent --location --retry 3 https://cdn.jsdelivr.net/npm/axe-core@4.13.0/axe.min.js -o "$TALARIA_AXE_PATH"
          echo 'c24f097bd2f451d4f933e8bc7d8d539f8672a2ebcb5cc9f9f3eec8ca9470a0c1  .local/axe.min.js' | sha256sum --check
      - name: Run selected backend and Chromium regressions
        if: steps.scope.outputs.runtime == 'true'
        run: uv run --locked python contrib/check.py ci

  platforms:
    needs: lint
    if: inputs.full
    name: Platform (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04-arm
            python: '3.14'
          - os: macos-26
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          checksum: *uv-checksum
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Backend, fresh wheel, startup, plugin export, update and rollback
        run: uv run --locked pytest -q -m 'not browser and not hermes and not quality' --fail-on-skip --junitxml=test-results/platform.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: platform-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
          retention-days: 7

  browsers:
    needs: lint
    if: inputs.full || (github.event_name == 'workflow_dispatch' && inputs.browser != 'none' && inputs.browser != '')
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.full && '["chromium", "firefox", "webkit"]' || format('["{0}"]', inputs.browser)) }}
    env:
      TALARIA_TEST_BROWSER: ${{ matrix.browser }}
      TALARIA_AXE_PATH: ${{ github.workspace }}/.local/axe.min.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          checksum: *uv-checksum
          python-version: '3.12'
          # The Linux backend job saves this same dependency cache.
          save-cache: false
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps "$TALARIA_TEST_BROWSER"
      - name: Fetch and verify pinned accessibility engine
        run: |
          mkdir -p .local
          curl --fail --show-error --silent --location --retry 3 https://cdn.jsdelivr.net/npm/axe-core@4.13.0/axe.min.js -o "$TALARIA_AXE_PATH"
          echo 'c24f097bd2f451d4f933e8bc7d8d539f8672a2ebcb5cc9f9f3eec8ca9470a0c1  .local/axe.min.js' | sha256sum --check
      - name: Browser regressions
        shell: bash
        run: |
          mkdir -p test-results
          vmstat -w 30 > test-results/resources.log &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          # Leave time for artifact upload even if pytest or browser teardown stalls.
          timeout --kill-after=15s 17m bash -o pipefail <<'BROWSER'
          uv run --locked pytest -v -n 2 -m browser --fail-on-skip --timeout=120 --timeout-method=thread --max-worker-restart=0 -o faulthandler_timeout=90 --durations=10 --junitxml=test-results/browser.xml 2>&1 | tee test-results/browser.log | awk '
            length($0) > 2000 { print substr($0, 1, 2000) "... [line shortened; see browser.log]"; fflush(); next }
            { print; fflush() }'
          BROWSER
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  hermes:
    needs: lint
    if: inputs.full || inputs.hermes_latest || github.event_name == 'schedule'
    name: Native Hermes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HERMES_SOURCE: ${{ github.workspace }}/.local/hermes
      HERMES_DISABLE_LAZY_INSTALLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ (inputs.hermes_latest || github.event_name == 'schedule') && 'main' || '205645ee424163c7b6cfc032c331c3557797497b' }}
          path: .local/hermes
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          checksum: *uv-checksum
          python-version: '3.12'
      - run: uv sync --locked
      - name: Install Hermes from its own lockfile (sms extra supplies aiohttp)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.HERMES_SOURCE }}/venv
        run: uv sync --project "$HERMES_SOURCE" --frozen --no-dev --extra sms --python 3.12
      - run: uv run --locked pytest -q -m hermes --fail-on-skip --junitxml=test-results/hermes.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-hermes
          path: test-results/
          retention-days: 7

  wsl:
    needs: lint
    if: inputs.full
    name: Windows WSL2
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ubuntu in WSL2
        shell: pwsh
        run: |
          wsl --set-default-version 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl --install --distribution Ubuntu-24.04 --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl --distribution Ubuntu-24.04 --user root --exec bash -c 'uname -r | grep -i microsoft-standard-WSL2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test from the Linux filesystem
        shell: pwsh
        run: |
          $source = (wsl --distribution Ubuntu-24.04 --user root --exec wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          wsl --distribution Ubuntu-24.04 --user root --exec bash "$source/.github/scripts/wsl.sh" "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  required:
    name: ${{ inputs.full && 'Release validation' || 'Required checks' }}
    if: always()
    needs: [lint, behavior, platforms, browsers, hermes, wsl]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ inputs.full || false }}
          PUBLIC_PR: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
          NATIVE: ${{ inputs.hermes_latest || github.event_name == 'schedule' }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          required = {'lint'}
          if os.environ['FULL'] == 'true':
              required.update({'platforms', 'browsers', 'hermes', 'wsl'})
          if os.environ['PUBLIC_PR'] == 'true':
              required.add('behavior')
          if os.environ['NATIVE'] == 'true':
              required.add('hermes')
          assert all(results[name]['result'] == 'success' for name in required), results
          assert all(job['result'] in {'success', 'skipped'} for job in results.values()), results
          PY
