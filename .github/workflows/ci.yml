name: CI

on:
  pull_request:
  schedule:
    - cron: '43 8 * * 1'
    # Every browser test on every browser, which nothing else needs to wait for.
    - cron: '17 7 * * *'
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Run every platform and browser
        type: boolean
        default: false
      browser:
        description: Run one browser when full is off
        type: choice
        default: none
        options: [none, chromium, firefox, webkit]
      hermes_latest:
        description: Test the latest Hermes main commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full && 'full' || inputs.browser || 'none' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          checksum: &uv-checksum ${{ runner.os == 'macOS' && '81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731' || runner.arch == 'ARM64' && '71279f8d3c67241e807b9d8db872d1bf541579fb9f08b7d1eb1682196d1e57dc' || 'c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83' }}
          python-version: '3.14.10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm install --global npm@12.2.1 --ignore-scripts
        working-directory: ${{ runner.temp }}
      - name: Install lint tools (retry transient binary downloads)
        run: |
          for attempt in 1 2 3; do
            if uv sync --locked --only-group lint; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
          done
          exit 1
      - run: uv run --locked --only-group lint python contrib/quality.py
      - name: Verify the quality gates
        if: inputs.full
        run: |
          uv sync --locked
          uv run --locked pytest -q -m quality --fail-on-skip

  fuzz:
    name: Fuzz streamed Markdown
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm install --global npm@12.2.1 --ignore-scripts
        working-directory: ${{ runner.temp }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Pull requests repeat one seed so they can't fail at random. This one explores.
      - run: node tests/markdown_stream_fuzz.mjs 100000 "$GITHUB_RUN_ID"

  behavior:
    name: PR behavior
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TALARIA_TEST_WORKERS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select checks from the PR merge changes
        id: scope
        run: python3 contrib/check.py ci --plan >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scope.outputs.runtime == 'true'
        with:
          version: '0.13.7'
          checksum: *uv-checksum
          python-version: '3.14.10'
      - if: steps.scope.outputs.runtime == 'true'
        run: uv sync --locked
      - name: Run selected backend regressions
        if: steps.scope.outputs.runtime == 'true'
        run: uv run --locked python contrib/check.py ci --stage backend
      - name: Walk a new user's install through real Hermes
        if: steps.scope.outputs.install == 'true'
        run: uv run --locked python contrib/install_walkthrough.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.scope.outputs.install == 'true'
        with:
          name: install-walkthrough-pr
          path: test-results/install-walkthrough/
          retention-days: 7

  behavior_browser:
    name: PR Chromium (${{ matrix.shard }}/2)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TALARIA_TEST_WORKERS: '3'
      TALARIA_AXE_PATH: ${{ github.workspace }}/.local/axe.min.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select checks from the PR merge changes
        id: scope
        run: python3 contrib/check.py ci --plan >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scope.outputs.browser == 'true'
        with:
          version: '0.13.7'
          checksum: *uv-checksum
          python-version: '3.14.10'
          # The backend job saves this same dependency cache.
          save-cache: false
      - if: steps.scope.outputs.browser == 'true'
        run: uv sync --locked
      - if: steps.scope.outputs.browser == 'true'
        uses: ./.github/actions/playwright-browser
        with:
          browser: chromium
      - if: steps.scope.outputs.browser == 'true'
        run: |
          mkdir -p .local
          curl --fail --show-error --silent --location --retry 3 https://cdn.jsdelivr.net/npm/axe-core@4.14.0/axe.min.js -o "$TALARIA_AXE_PATH"
          echo '20c09fe157a8a34a30e241aaa1fcdade657734f08ab379ecfbeb7d45cc46e878  .local/axe.min.js' | sha256sum --check
      - name: Run selected Chromium regressions
        if: steps.scope.outputs.browser == 'true'
        env:
          SHARD: ${{ matrix.shard }}/2
        run: uv run --locked python contrib/check.py ci --stage browser --shard "$SHARD"

  platforms:
    needs: lint
    if: inputs.full
    name: Platform (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TALARIA_TEST_WORKERS: '2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.16'
          - os: ubuntu-24.04-arm
            python: '3.15.2'
          - os: macos-26
            python: '3.14.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          checksum: *uv-checksum
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Backend, fresh wheel, startup, plugin export, update and rollback
        # General backend logic runs once; every OS retains the portability suite.
        run: uv run --locked python contrib/check.py platform ${{ matrix.os == 'ubuntu-24.04' && '--full' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
          retention-days: 7

  browsers:
    needs: lint
    if: inputs.full || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.browser != 'none' && inputs.browser != '')
    name: Browser (${{ matrix.browser }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((inputs.full || github.event_name == 'schedule') && '["chromium", "firefox", "webkit"]' || format('["{0}"]', inputs.browser)) }}
        shard: [1, 2, 3, 4]
    env:
      TALARIA_TEST_BROWSER: ${{ matrix.browser }}
      TALARIA_TEST_SHARD: ${{ matrix.shard }}/4
      # A release runs everything on Chromium, and what can differ on the others.
      TALARIA_TEST_MARK: ${{ inputs.full && matrix.browser != 'chromium' && 'cross_browser' || 'browser' }}
      TALARIA_AXE_PATH: ${{ github.workspace }}/.local/axe.min.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          checksum: *uv-checksum
          python-version: '3.12.16'
          # The Linux backend job saves this same dependency cache.
          save-cache: false
      - run: uv sync --locked
      - uses: ./.github/actions/playwright-browser
        with:
          browser: ${{ matrix.browser }}
      - name: Fetch and verify pinned accessibility engine
        run: |
          mkdir -p .local
          curl --fail --show-error --silent --location --retry 3 https://cdn.jsdelivr.net/npm/axe-core@4.14.0/axe.min.js -o "$TALARIA_AXE_PATH"
          echo '20c09fe157a8a34a30e241aaa1fcdade657734f08ab379ecfbeb7d45cc46e878  .local/axe.min.js' | sha256sum --check
      - name: Browser regressions
        shell: bash
        run: |
          mkdir -p test-results
          vmstat -w 30 > test-results/resources.log &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          # Leave time for artifact upload even if pytest or browser teardown stalls.
          timeout --kill-after=15s 10m bash -o pipefail <<'BROWSER'
          uv run --locked pytest -v -n 3 --dist load --maxschedchunk=1 -m "$TALARIA_TEST_MARK" --browser-shard "$TALARIA_TEST_SHARD" --fail-on-skip --timeout=120 --timeout-method=thread --max-worker-restart=0 --maxfail=1 -o faulthandler_timeout=90 --durations=10 --junitxml=test-results/browser.xml 2>&1 | tee test-results/browser.log | awk '
            length($0) > 2000 { print substr($0, 1, 2000) "... [line shortened; see browser.log]"; fflush(); next }
            { print; fflush() }'
          BROWSER
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  catalog:
    name: Plugin catalog admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_EXCLUDE_NEWER: '14 days'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 3b421578588243f920886e6fe79a6faa87ea026e # v0.23.1
          path: .local/hermes-catalog
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          checksum: *uv-checksum
          python-version: '3.14.10'
      - name: Prepare the locked Hermes validator
        run: uv sync --project .local/hermes-catalog --frozen --no-dev --extra sms --python "$UV_PYTHON"
      - name: Validate the exact commit and prepare its catalog entry
        run: .local/hermes-catalog/.venv/bin/python contrib/plugin_catalog.py --revision HEAD --output .local/plugin-catalog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-catalog
          path: .local/plugin-catalog/
          retention-days: 7

  hermes:
    needs: lint
    if: inputs.full || inputs.hermes_latest || github.event.schedule == '43 8 * * 1'
    name: Native Hermes (${{ matrix.hermes.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Releases cover the oldest supported release and the current stable one,
        # whose session authority the baseline lacks. Main's lockfile targets 3.14.
        hermes: ${{ fromJSON((inputs.hermes_latest || github.event.schedule == '43 8 * * 1') && '[{"name":"main","ref":"main","python":"3.14.10"}]' || '[{"name":"0.21.5","ref":"f97608f178d1ffeca59860195ab7da295f7c8e5f","python":"3.12.16"},{"name":"v0.23.1","ref":"3b421578588243f920886e6fe79a6faa87ea026e","python":"3.14.10"}]') }}
    env:
      HERMES_SOURCE: ${{ github.workspace }}/.local/hermes
      HERMES_DISABLE_LAZY_INSTALLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes.ref }}
          path: .local/hermes
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          checksum: *uv-checksum
          python-version: ${{ matrix.hermes.python }}
      - run: uv sync --locked
      - name: Install Hermes from its own lockfile (sms extra supplies aiohttp)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.HERMES_SOURCE }}/venv
        run: uv sync --project "$HERMES_SOURCE" --frozen --no-dev --extra sms --python "$UV_PYTHON"
      - run: uv run --locked pytest -q -m hermes --fail-on-skip --junitxml=test-results/hermes.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-hermes-${{ matrix.hermes.name }}
          path: test-results/
          retention-days: 7

  install:
    needs: lint
    if: inputs.full || inputs.hermes_latest || github.event.schedule == '43 8 * * 1'
    name: Install walkthrough (${{ matrix.hermes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        hermes: ${{ fromJSON((inputs.hermes_latest || github.event.schedule == '43 8 * * 1') && '["main"]' || '["stable"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          checksum: *uv-checksum
          python-version: '3.14.10'
      - run: uv sync --locked
      - name: Walk a new user's install through real Hermes
        env:
          HERMES_REF: ${{ matrix.hermes }}
        run: uv run --locked python contrib/install_walkthrough.py --hermes-ref "$HERMES_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: install-walkthrough-${{ matrix.hermes }}
          path: test-results/install-walkthrough/
          retention-days: 7

  wsl:
    needs: lint
    if: inputs.full
    name: Windows WSL2
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ubuntu in WSL2
        # Usually under a minute, and when it hangs it never recovers.
        timeout-minutes: 5
        shell: pwsh
        run: |
          wsl --set-default-version 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The download fails outright when a name doesn't resolve, so give the network another chance.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            wsl --install --distribution Ubuntu-24.04 --web-download --no-launch
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 30
          }
          wsl --distribution Ubuntu-24.04 --user root --exec bash -c 'uname -r | grep -i microsoft-standard-WSL2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test from the Linux filesystem
        shell: pwsh
        run: |
          $source = (wsl --distribution Ubuntu-24.04 --user root --exec wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          wsl --distribution Ubuntu-24.04 --user root --exec bash "$source/.github/scripts/wsl.sh" "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  dependency_review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  required:
    name: ${{ inputs.full && 'Release validation' || 'Required checks' }}
    if: always()
    needs: [lint, behavior, behavior_browser, dependency_review, platforms, browsers, catalog, hermes, install, wsl]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ inputs.full || false }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          NATIVE: ${{ inputs.hermes_latest || github.event.schedule == '43 8 * * 1' }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          required = {'lint', 'catalog'}
          if os.environ['FULL'] == 'true':
              required.update({'platforms', 'browsers', 'hermes', 'install', 'wsl'})
          if os.environ['PULL_REQUEST'] == 'true':
              required.update({'behavior', 'behavior_browser', 'dependency_review'})
          if os.environ['NATIVE'] == 'true':
              required.update({'hermes', 'install'})
          assert all(results[name]['result'] == 'success' for name in required), results
          assert all(job['result'] in {'success', 'skipped'} for job in results.values()), results
          PY
