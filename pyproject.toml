[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "talaria-webui"
version = "0.3.6"
description = "A lightweight web interface for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "starlette>=1.6,<2",
  "httpx>=0.28,<1",
  "uvicorn>=0.52.4,<1",
]

[project.scripts]
talaria = "talaria.cli:main"

[dependency-groups]
lint = [
    "actionlint-py>=1.7,<2",
    "pre-commit-hooks>=6,<7",
    "ruff>=0.16.6,<1",
    "shellcheck-py>=0.11,<1",
    "vulture>=2.14,<3",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "playwright>=1.62,<2",
    {include-group = "lint"},
    "pytest-xdist>=3.8,<4",
    "pytest-timeout>=2.4,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talaria"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: requires Playwright",
    "hermes: requires a native Hermes checkout",
    "quality: requires the developer JavaScript and lint toolchain",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Typographic apostrophes are intentional in user-facing prose.
allowed-confusables = ["’"]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "PIE", "SIM", "RUF", "C90", "PLR0912", "PLR0915", "T10"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Test scenarios and development orchestration are not production functions.
"tests/**" = ["C901", "PLR0912", "PLR0915"]
"contrib/**" = ["C901", "PLR0912", "PLR0915"]
".github/scripts/**" = ["C901", "PLR0912", "PLR0915"]

[tool.vulture]
paths = ["src", "contrib", ".github/scripts"]
min_confidence = 60
