[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "talaria-webui"
version = "0.3.2"
description = "A considered web client for Hermes Agent"
requires-python = ">=3.12"
dependencies = [
  "starlette>=1.6,<2",
  "httpx>=0.28,<1",
  "uvicorn>=0.52.4,<1",
]

[project.scripts]
talaria = "talaria.cli:main"

[dependency-groups]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "playwright>=1.62,<2", "ruff>=0.16.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/talaria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
