[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "talaria-webui"
version = "0.3.2"
description = "A considered web client for Hermes Agent"
requires-python = ">=3.12"
dependencies = [
  "starlette>=1.6,<2",
  "httpx>=0.28,<1",
  "uvicorn>=0.52.4,<1",
]

[project.scripts]
talaria = "talaria.cli:main"

[dependency-groups]
lint = ["ruff>=0.16.6,<1"]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "playwright>=1.62,<2",
    {include-group = "lint"},
    "pytest-xdist>=3.8,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talaria"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: requires Playwright", "hermes: requires a native Hermes checkout"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
