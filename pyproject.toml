[build-system]
requires = ["hatchling==1.33.0", "brotli==1.2.1"]
build-backend = "hatchling.build"

[project]
name = "talaria-webui"
version = "0.3.25"
description = "A lightweight web interface for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "starlette==1.10.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
]

[project.scripts]
talaria = "talaria.cli:main"

[dependency-groups]
lint = [
    "actionlint-py==1.7.12.25",
    "pre-commit-hooks==6.0.0",
    "ruff==0.17.3",
    "shellcheck-py==0.11.0.1",
    "vulture==2.16",
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "playwright==1.64.1",
    {include-group = "lint"},
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talaria"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: requires Playwright",
    "cross_browser: browser tests that releases also run on Firefox and WebKit",
    "hermes: requires a native Hermes checkout",
    "quality: requires the developer JavaScript and lint toolchain",
    "clock: install Playwright's clock before application startup",
    "production: run the browser against the packaged production frontend",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Typographic apostrophes are intentional in user-facing prose.
allowed-confusables = ["’"]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "PIE", "SIM", "RUF", "C90", "PLR0912", "PLR0915", "T10"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Test scenarios and development orchestration are not production functions.
"tests/**" = ["C901", "PLR0912", "PLR0915"]
"contrib/**" = ["C901", "PLR0912", "PLR0915"]
".github/scripts/**" = ["C901", "PLR0912", "PLR0915"]

[tool.vulture]
paths = ["src", "contrib", ".github/scripts"]
min_confidence = 60
